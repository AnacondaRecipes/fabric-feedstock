{% set name = "fabric" %}
{% set version = "3.2.3" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: dcbd2c47ad87688facaef5cc11aab6d1ec9ed05645fed97a5de7204d5d17cc44

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    # binary_name = "fab"
    - fab = fabric.main:program.run
  skip: true  # [py<36]

requirements:
  host:
    - python
    - pip
    - setuptools
    - wheel
  run:
    - python
    - invoke >=2.0,<3.0
    - paramiko >=2.4
    - decorator >=5
    - deprecated >=1.2

# Unable to run tests: ModuleNotFoundError: No module named 'icecream' -> https://pypi.org/project/icecream
test:
  imports:
    - fabric
  commands:
    - pip check
    - fab --help
  requires:
    - pip
 

about:
  home: http://fabfile.org
  license_file: LICENSE
  license: BSD 2-Clause
  license_family: BSD
  summary: Fabric is a simple, Pythonic tool for remote execution and deployment.
  description: |
    Fabric is a Python library and command-line tool for streamlining the use
    of SSH for application deployment or systems administration tasks.
  doc_url: http://docs.fabfile.org
  doc_source_url: https://github.com/fabric/fabric/blob/master/sites/docs/index.rst#id1
  dev_url: https://github.com/fabric/fabric

extra:
  recipe-maintainers:
    - pmlandwehr
